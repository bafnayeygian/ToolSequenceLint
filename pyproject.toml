[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="toolsequencelint"
version="1.0.0"
description="Validate AI agent tool-call sequences against declarative workflow rules, ordering constraints, prerequisites, and forbidden transitions."
readme="README.md"
requires-python=">=3.9"
license={text="MIT"}

[project.scripts]
tool-sequence-lint="tool_sequence_lint.cli:main"

[tool.setuptools.packages.find]
where=["src"]
